name: MangaHarvester
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MH_APP_GROUP: group.com.example.mangaharvester
targets:
  MangaHarvester:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mangaharvester
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 面白さのメモ
        MHAppGroup: $(MH_APP_GROUP)
        NSCameraUsageDescription: 面白かった表現を写真で残します。
        NSMicrophoneUsageDescription: 面白かった理由を一言、音声で残します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(MH_APP_GROUP)]
    dependencies:
      - target: MangaShare
        embed: true
  MangaShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mangaharvester.share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: 面白さのメモ
        MHAppGroup: $(MH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Generated/Share.entitlements
      properties:
        com.apple.security.application-groups: [$(MH_APP_GROUP)]
